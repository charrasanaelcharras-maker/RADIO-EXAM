
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen - RADIO EXAM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>RADIO EXAM</h1>
        <p>Examen de Técnica y Electrónica</p>
    </header>

    <main>

        <h2>Examen de conocimientos</h2>
        <p class="info">Seleccioná una respuesta para cada pregunta.</p>

        <!-- BARRA DE PROGRESO FIJA -->
        <div class="progreso-fijo">
            <div class="progreso-contenedor">

                <div class="progreso-info">
                    <span>Progreso del examen</span>
                    <span id="contador">0 de 15 respondidas</span>
                </div>

                <div class="barra-fondo">
                    <div class="barra-progreso" id="barra"></div>
                </div>

            </div>
        </div>

        <form action="{{ url_for('corregir') }}" method="POST" id="formulario">

            {% for pregunta in preguntas %}
            <section class="pregunta">

                <div class="numero-pregunta">
                    PREGUNTA {{ loop.index }} DE 15
                </div>

                <h3>{{ loop.index }}. {{ pregunta.pregunta }}</h3>

                <label>
                    <input type="radio" name="{{ pregunta.id }}" value="a" required>
                    A) {{ pregunta.opcion_a }}
                </label>

                <label>
                    <input type="radio" name="{{ pregunta.id }}" value="b">
                    B) {{ pregunta.opcion_b }}
                </label>

                <label>
                    <input type="radio" name="{{ pregunta.id }}" value="c">
                    C) {{ pregunta.opcion_c }}
                </label>

                <label>
                    <input type="radio" name="{{ pregunta.id }}" value="d">
                    D) {{ pregunta.opcion_d }}
                </label>

            </section>
            {% endfor %}

            <button type="submit" class="boton-finalizar">
                Finalizar examen
            </button>

        </form>

    </main>

    <script>
        const formulario = document.getElementById("formulario");
        const contador = document.getElementById("contador");
        const barra = document.getElementById("barra");

        const totalPreguntas = 15;

        function actualizarProgreso() {

            const respondidas = new Set();

            formulario.querySelectorAll('input[type="radio"]:checked')
                .forEach(input => {
                    respondidas.add(input.name);
                });

            const cantidad = respondidas.size;
            const porcentaje = (cantidad / totalPreguntas) * 100;

            contador.textContent =
                cantidad + " de " + totalPreguntas + " respondidas";

            barra.style.width = porcentaje + "%";
        }

        formulario.addEventListener("change", actualizarProgreso);
    </script>

</body>
</html>
